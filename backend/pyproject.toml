[project]
name = "karin-bank-backend"
version = "0.1.0"
requires-python = ">=3.11"
description = "Karin Bank backend service"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "clickhouse-connect>=0.7.0",
    "aiokafka>=0.11.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "confluent-kafka>=2.3.0",
    "cryptography>=42.0.0",
    "dateutil>=2.9.0",
    "zod-py",
    "stripe>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
