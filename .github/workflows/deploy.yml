# Requests a production deploy. This workflow never touches the VM directly:
# it only records a GitHub Deployment. The deploy agent running on the VM polls
# for that deployment and applies it locally (see scripts/DEPLOY-AGENT.md).
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you deploying?"
        required: false
        default: "manual deploy"

permissions:
  contents: read
  deployments: write

jobs:
  request-deploy:
    name: Request Production Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify images were published for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAX_ATTEMPTS=40
          attempt=0
          while [ $attempt -lt $MAX_ATTEMPTS ]; do
            run_json=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/docker-publish.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
              --jq '.workflow_runs[0]')
            status=$(echo "$run_json" | jq -r '.status // "none"')
            conclusion=$(echo "$run_json" | jq -r '.conclusion // "none"')

            if [ "$status" = "completed" ]; then
              echo "docker-publish for ${{ github.sha }}: status=$status, conclusion=$conclusion"
              if [ "$conclusion" = "success" ]; then
                echo "Docker image build verified successfully."
                break
              else
                echo "::error::Docker image build failed with conclusion: $conclusion"
                exit 1
              fi
            elif [ "$status" = "in_progress" ] || [ "$status" = "queued" ] || [ "$status" = "requested" ] || [ "$status" = "waiting" ]; then
              echo "docker-publish is currently $status... waiting for completion (attempt $((attempt+1))/$MAX_ATTEMPTS)"
              sleep 15
              attempt=$((attempt+1))
            else
              echo "::error::No docker-publish workflow run found for commit ${{ github.sha }}."
              exit 1
            fi
          done

          if [ $attempt -eq $MAX_ATTEMPTS ]; then
            echo "::error::Timed out waiting for docker-publish workflow to complete."
            exit 1
          fi

      - name: Create deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/deployments" -X POST --input - <<EOF
          {
            "ref": "${{ github.sha }}",
            "environment": "production",
            "description": "${{ inputs.reason }} (by ${{ github.actor }})",
            "auto_merge": false,
            "required_contexts": [],
            "production_environment": true
          }
          EOF
          echo "Deployment requested. The VM agent will pick it up on its next poll."
